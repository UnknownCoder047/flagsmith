name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            scripts/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix scripts ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check
